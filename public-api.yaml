          format: double
        maxMemoryMiB:
          type: number
          format: double
        p80MemoryMiB:
          type: number
          format: double
        p95MemoryMiB:
          type: number
          format: double
        p99MemoryMiB:
          type: number
          format: double
        p999MemoryMiB:
          type: number
          format: double
        avgUnits:
          type: number
          format: double
        minUnits:
          type: number
          format: double
        maxUnits:
          type: number
          format: double
        p80Units:
          type: number
          format: double
        p95Units:
          type: number
          format: double
        p99Units:
          type: number
          format: double
        p999Units:
          type: number
          format: double
      required:
        - avgMemoryMiB
        - minMemoryMiB
        - maxMemoryMiB
        - p80MemoryMiB
        - p95MemoryMiB
        - p99MemoryMiB
        - p999MemoryMiB
        - avgUnits
        - minUnits
        - maxUnits
        - p80Units
        - p95Units
        - p99Units
        - p999Units

