          format: double
        p80MiB:
          type: number
          format: double
        p95MiB:
          type: number
          format: double
        p99MiB:
          type: number
          format: double
        p999MiB:
          type: number
          format: double
      required: [avgMiB, minMiB, maxMiB, p80MiB, p95MiB, p99MiB, p999MiB]

    MemUtilization:
      type: object
      properties:
