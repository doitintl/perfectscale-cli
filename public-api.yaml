openapi: 3.0.3
info:
  title: Perfectscale API - OpenAPI 3.0
  version: v1
servers:
  - url: https://api.app.perfectscale.io/public/v1

security:
  - auth: []

paths:
  /automation/audit_logs:
    post:
      operationId: AutomationAuditLogs
      summary: "Get Automation Audit Logs with Cursor Pagination"
      description: |
        Retrieves a list of automation audit log entries within a specified time range, using cursor-based pagination.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date-time
                  description: |
                    The start of the time range in ISO 8601 format with UTC timezone.
                    Defaults server-side to 30 days ago if omitted. Cannot be earlier than 30 days ago.
                to:
                  type: string
                  format: date-time
                  description: |
                    The end of the time range in ISO 8601 format with UTC timezone.
                    Defaults server-side to "now" if omitted.
                page_size:
                  type: integer
                  default: 1000
                  minimum: 1
                  maximum: 5000
                  description: "The maximum number of items to return. Defaults to 1000. Must be between 1 and 5000."
                after:
                  type: string
                  description: "Cursor token from a previous response's pagination.next, used to fetch the next page."
                before:
                  type: string
                  description: "Cursor token from a previous response's pagination.prev, used to fetch the previous page."
                cluster_uids:
                  type: array
                  items:
                    type: string
                  description: "Filter by cluster UIDs."
                namespaces:
                  type: array
                  items:
                    type: string
                  description: "Filter by Kubernetes namespaces."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AutomationLogEntry"
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                    required: [pagination]
                required: [data, meta]

  /clusters/{cluster_uid}/workloads:
    get:
      tags:
        - Workloads
      summary: List all workloads in a specified cluster
      parameters:
        - name: cluster_uid
          in: path
          required: true
          schema:
            type: string
          description: The unique identifier for the cluster
      responses:
        "200":
          description: A list of workloads
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: The total number of workloads in the specified cluster.
                        example: 10
                    required:
                      - count
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workload"
                required:
                  - meta
                  - data
        "404":
          description: Cluster not found
        "500":
          description: Internal server error
      security:
        - auth: []

  /clusters:
    get:
      operationId: GetClusters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Cluster"
                required: [data]

  /clusters/{cluster_uid}/node-groups:
    get:
      operationId: ListInfraFitNodeGroups
      tags:
        - NodeGroups
      summary: List node groups with utilization, cost, and recommendation data
      parameters:
        - name: cluster_uid
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            default: P30D
          description: >
            ISO-8601 duration window for utilization/cost figures (e.g. P30D).
            Recommendations always use a 30 day window.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
        - name: pageToken
          in: query
          required: false
          schema:
            type: string
          description: Opaque, direction-encoded cursor from a previous response's meta.pagination.next or prev.
        - name: recommendationLimit
          in: query
          required: false
          schema:
            type: integer
            default: 3
            minimum: 1
            maximum: 20
          description: Caps node-type recommendations per node group. Karpenter pools always return the full change set.
        - name: hasRecommendations
          in: query
          required: false
          schema:
            type: boolean
          description: >
            When true, only node groups with at least one actionable recommendation.
            When false, only node groups without recommendations.
        - name: includeMuted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, includes muted recommendations.
        - name: autoscalerType
          in: query
          required: false
          schema:
            type: string
          description: Filter by autoscaler type (e.g. karpenter, cluster_autoscaler).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InfraFitNodeGroup"
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/CursorPagination"
                      timeframe:
                        type: string
                    required: [pagination, timeframe]
                required: [data, meta]
        "404":
          description: Cluster not found
        "500":
          description: Internal server error
      security:
        - auth: []

  /clusters/{cluster_uid}/node-groups/{node_group_name}:
    get:
      operationId: GetInfraFitNodeGroup
      tags:
        - NodeGroups
      summary: Get a single node group by name
      parameters:
        - name: cluster_uid
          in: path
          required: true
          schema:
            type: string
        - name: node_group_name
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            default: P30D
        - name: recommendationLimit
          in: query
          required: false
          schema:
            type: integer
            default: 3
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InfraFitNodeGroup"
                required: [data]
        "404":
          description: Node group not found
        "500":
          description: Internal server error
      security:
        - auth: []

  /clusters/{cluster_uid}:
    get:
      operationId: GetCluster
      parameters:
        - name: cluster_uid
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
          description: The period for which carbon emission is calculated
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClusterDetail"
                required: [data]
    delete:
      operationId: DeleteCluster
      parameters:
        - name: cluster_uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: OK
        "404":
          description: NotFound

  /clusters/{cluster_uid}/unevictable-pods:
    get:
      operationId: ListUnevictablePods
      tags:
        - Unevictable
      summary: List unevictable pods in a cluster
      description: >
        Returns the pods from the latest pre-computed unevictable-pods
        snapshot for the cluster (no request-time recompute).
      parameters:
        - name: cluster_uid
          in: path
          required: true
          schema:
            type: string
          description: Cluster unique identifier
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: >
            Composite filter expression: clauses of the form `key[:op]:value`
            joined by `|` (AND); `op` is optional and defaults to `eq`;
            comma-separate values within a clause for an IN match, e.g.
            `filter=namespace:payments|blockedCostHourly:gte:10`. Supported
            keys for this endpoint: `namespace` (eq), `blockedCostHourly`
            (eq/gte/lte, compares numerically on the underlying cost value,
            not the serialized Money object), `reasonCode` (eq), `nodeGroup`
            (eq). Mute-status filtering is handled by the separate `mute`
            parameter, not this filter.
        - name: mute
          in: query
          required: false
          schema:
            type: string
            enum: [exclude, include, only]
            default: exclude
          description: >
            Muted-finding handling: `exclude` (default) hides pods whose
            workload has a dismissal rule; `include` returns all pods,
            flagging muted ones via `mute`/`mutedByRule` on each reason;
            `only` returns exclusively muted pods.
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [blockedCostHourly]
          description: Field to sort results by.
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction, applied only when sortBy is set.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          description: Number of items per page (default 50, max 500)
        - name: pageToken
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor token from a previous response's meta.pagination.next or prev.
      responses:
        "200":
          description: List of unevictable pods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UnevictablePod"
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/CursorPagination"
                      snapshotTime:
                        type: string
                        format: date-time
                        description: Timestamp (RFC 3339, UTC) of the snapshot the data was read from.
                      algorithmVersion:
                        type: string
                        description: Version of the unevictable-detection algorithm used to produce the snapshot.
                      summary:
                        $ref: "#/components/schemas/UnevictableSummary"
                    required: [pagination, snapshotTime, algorithmVersion, summary]
                required: [data, meta]
        "202":
          description: Raw snapshot exists but is still being processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UnevictablePodsStatus"
                required: [data]
        "404":
          description: Cluster or snapshot not found
        "422":
          description: Raw snapshot exists but processing failed
        "500":
          description: Internal server error
      security:
        - auth: []

  /clusters/{cluster_uid}/unevictable-report:
    get:
      operationId: GetUnevictableReport
      tags:
        - Unevictable
      summary: Per-pod unevictable report — one row per pod, with all its reasons combined
      description: >
        Issues view — one row per pod, carrying all of that pod's unevictable
        reasons. Served from the latest pre-computed snapshot (no
        request-time recompute).
      parameters:
        - name: cluster_uid
          in: path
          required: true
          schema:
            type: string
          description: Cluster unique identifier
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: >
            Composite filter expression: clauses of the form `key[:op]:value`
            joined by `|` (AND); `op` is optional and defaults to `eq`;
            comma-separate values within a clause for an IN match. Supported
            keys for this endpoint: `namespace` (eq), `blockedCostHourly`
            (eq/gte/lte, compares numerically on the underlying cost value,
            not the serialized Money object), `nodeGroup` (eq). Unlike
            `unevictable-pods`, `reasonCode` is not filterable here. Mute-status
            filtering is handled by the separate `mute` parameter, not this
            filter.
        - name: mute
          in: query
          required: false
          schema:
            type: string
            enum: [exclude, include, only]
            default: exclude
          description: >
            Muted-finding handling: `exclude` (default) hides rows whose
            workload has a dismissal rule; `include` returns all rows,
            flagged via `mute`; `only` returns exclusively muted rows.
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [blockedCostHourly]
          description: Field to sort results by.
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction, applied only when sortBy is set.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          description: Number of items per page (default 50, max 500)
        - name: pageToken
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor token from a previous response's meta.pagination.next or prev.
      responses:
        "200":
          description: List of unevictable pod issue rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UnevictableReportRow"
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/CursorPagination"
                      snapshotTime:
                        type: string
                        format: date-time
                        description: Timestamp (RFC 3339, UTC) of the snapshot the data was read from.
                      algorithmVersion:
                        type: string
                        description: Version of the unevictable-detection algorithm used to produce the snapshot.
                      summary:
                        $ref: "#/components/schemas/UnevictableSummary"
                    required: [pagination, snapshotTime, algorithmVersion, summary]
                required: [data, meta]
        "202":
          description: Raw snapshot exists but is still being processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UnevictablePodsStatus"
                required: [data]
        "404":
          description: Cluster or snapshot not found
        "422":
          description: Raw snapshot exists but processing failed
        "500":
          description: Internal server error
      security:
        - auth: []

  /clusters/{cluster_uid}/unevictable-pods/{pod_uid}:
    get:
      operationId: GetUnevictablePod
      tags:
        - Unevictable
      summary: Get a single unevictable pod
      description: >
        Full detail for one pod (all reasons with the full remediation
        object), served from the latest pre-computed snapshot (no
        request-time recompute). Unlike every other endpoint in this API,
        the 200 and 202 responses are returned directly, with no {data}
        envelope.
      parameters:
        - name: cluster_uid
          in: path
          required: true
          schema:
            type: string
          description: Cluster unique identifier
        - name: pod_uid
          in: path
          required: true
          schema:
            type: string
          description: Pod unique identifier
      responses:
        "200":
          description: Single unevictable pod, returned directly (no envelope)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnevictablePod"
        "202":
          description: Raw snapshot exists but is still being processed, returned directly (no envelope)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnevictablePodsStatus"
        "404":
          description: Cluster or snapshot not found, or no pod with this uid in the latest snapshot
        "422":
          description: Raw snapshot exists but processing failed
        "500":
          description: Internal server error
      security:
        - auth: []

  /clusters/{cluster_uid}/unevictable-muted-workloads:
    get:
      operationId: ListUnevictableMutedWorkloads
      tags:
        - Unevictable
      summary: List unevictable muted workloads for a cluster
      description: >
        Read-only list of workloads that have an active mute (dismissal) rule
        for the cluster. Rules are created and removed via the web app / user
        API only; this endpoint does not expose write operations.
      parameters:
        - name: cluster_uid
          in: path
          required: true
          schema:
            type: string
          description: Cluster unique identifier
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          description: Number of items per page (default 50, max 500)
        - name: pageToken
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor token from a previous response's meta.pagination.next or prev.
      responses:
        "200":
          description: List of muted workloads for the cluster
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UnevictableMutedWorkload"
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/CursorPagination"
                    required: [pagination]
                required: [data, meta]
        "404":
          description: Cluster not found
        "500":
          description: Internal server error
      security:
        - auth: []

components:
  securitySchemes:
    auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OptimizationPolicy:
      type: string
      description: The optimization policy determining resource allocation strategy.
      enum: [balanced, extraHeadroom, maxHeadroom, maxSavings]

    OptimizationPolicyTimeWindow:
      type: string
      description: The time window for optimization policy.
      enum: ["14d", "21d", "30d", "45d", "policyDefault"]
      x-enum-varnames: [TimeWindow14d, TimeWindow21d, TimeWindow30d, TimeWindow45d, PolicyDefault]

    Workload:
      type: object
      properties:
        id:
          type: string
          description: A unique identifier for the workload, usually following a namespace-type-name convention.
          example: "examplenamespace-deployment-example-test-workload"
        name:
          type: string
          description: A human-readable name for the workload.
          example: "example-test-workload"
        type:
          type: string
          description: The type of Kubernetes workload. Common types include Deployment, StatefulSet, and DaemonSet, but other string values can also be used to represent custom or extended workload types.
          example: "Deployment"
        namespace:
          type: string
          description: The Kubernetes namespace in which the workload resides.
          example: "examplenamespace"
        firstSeen:
          type: string
          format: date-time
          description: The timestamp when the workload was first observed.
          example: "2023-04-08T16:51:08Z"
        lastSeen:
          type: string
          format: date-time
          description: The timestamp when the workload was last observed.
          example: "2023-10-22T15:23:22.9Z"
        runningMinutes:
          type: integer
          description: The total number of minutes the workload has been running.
          example: 40265
        replicasCounts:
          $ref: "#/components/schemas/ReplicasCounts"
        resilienceLevel:
          type: string
          description: |
            **Deprecated**: Use `optimizationPolicy` instead. The resilience level of the workload (configured on Perfectscale side).
            
            Mapping to optimizationPolicy values:
            - `low` → `maxSavings`
            - `medium` → `balanced`
            - `high` → `extraHeadroom`
            - `highest` → `maxHeadroom`
          deprecated: true
          enum: [low, medium, high, highest]
          example: "medium"
        optimizationPolicy:
          allOf:
            - $ref: "#/components/schemas/OptimizationPolicy"
          description: The optimization policy applied to the workload.
          example: "balanced"
        optimizationPolicyTimeWindow:
          allOf:
            - $ref: "#/components/schemas/OptimizationPolicyTimeWindow"
          description: The time window for optimization policy.
          example: "14d"
        cpuOptimizationPolicy:
          allOf:
            - $ref: "#/components/schemas/OptimizationPolicy"
          description: The CPU-specific optimization policy.
          example: "balanced"
        memoryOptimizationPolicy:
          allOf:
            - $ref: "#/components/schemas/OptimizationPolicy"
          description: The memory-specific optimization policy.
          example: "balanced"
        memoryRequestEqualsLimit:
          type: boolean
          description: Whether memory request equals limit is enabled.
          example: false
        muteStatus:
          $ref: "#/components/schemas/MuteStatus"
        costAnalysis:
          $ref: "#/components/schemas/CostAnalysis"
        workloadLabels:
          type: object
          description: Key-value pairs representing kubernets labels associated with the workload.
          additionalProperties:
            type: string
            description: A label value associated with a particular key.
        indicators:
          type: array
          description: A list of indicators providing insights into the performance and health of the workload.
          items:
            $ref: "#/components/schemas/Indicator"
        containers:
          type: array
          description: An object holding detailed information about each container within the workload.
          items:
            $ref: "#/components/schemas/Container"
      required:
        - id
        - name
        - type
        - namespace
        - firstSeen
        - lastSeen
        - runningMinutes
        - replicasCounts
        - resilienceLevel
        - optimizationPolicy
        - optimizationPolicyTimeWindow
        - cpuOptimizationPolicy
        - memoryOptimizationPolicy
        - memoryRequestEqualsLimit
        - muteStatus
        - costAnalysis
        - workloadLabels
        - indicators
        - containers

    ReplicasCounts:
      type: object
      description: An object representing the count statistics of replicas for a workload over a month period.
      properties:
        maxCount:
          type: integer
          description: The maximum count of replicas observed for the workload during the month period.
          example: 3
        avgCount:
          type: integer
          description: The average count of replicas observed for the workload during the month period.
          example: 2
      required: [maxCount, avgCount]

    MuteStatus:
      type: object
      properties:
        isMuted:
          type: boolean
          description: Indicates whether the workload is currently muted.
          example: false
        expires:
          type: string
          format: date-time
          nullable: true
          description: The date and time when the workload will automatically become unmuted. If null, the mute status does not expire automatically.
          example: null
      required: [isMuted, expires]

    Resources:
      type: object
      description: Metrics detailing the resource allocation in terms of memory and CPU.
      properties:
        memoryRequestMiB:
          type: number
          format: double
          description: The amount of memory requested for the workload in MiB.
          example: 128
        memoryLimitMiB:
          type: number
          format: double
          description: The maximum amount of memory that can be allocated for the workload in MiB.
          example: 256
        cpuRequestCores:
          type: number
          format: double
          description: The amount of CPU resources requested for the workload in cores.
          example: 128
        cpuLimitCores:
          type: number
          format: double
          description: The maximum amount of CPU resources that can be allocated for the workload in cores.
          example: 256
      required:
        - memoryRequestMiB
        - memoryLimitMiB
        - cpuRequestCores
        - cpuLimitCores

    Past30DaysCostAnalysis:
      type: object
      description: Metrics detailing the total and wasted costs associated with the workload's resource consumption.
      properties:
        totalCost:
          type: number
          format: double
          description: The total cost incurred by the workload's resource consumption.
          example: 1.2111549136128001
        wastedCost:
          type: number
          format: double
          description: The cost attributed to over-provisioned or inefficiently utilized resources.
          example: 0.370918634267412
        costPerHour:
          type: number
          format: double
          description: The cost of the workload per hour.
          example: 0.370918634267412
      required: [totalCost, wastedCost, costPerHour]

    Next30DaysCostAnalysis:
      type: object
      description: Metrics detailing the total and wasted costs associated with the workload's resource consumption.
      properties:
        costIncrease:
          type: number
          format: double
          description: The workload total cost increase.
          example: 1.2111549136128001
        potentialSavings:
          type: number
          format: double
          description: The potential savings for the workload.
          example: 0.370918634267412
      required: [costIncrease, potentialSavings]

    CostAnalysis:
      type: object
      description: Analysis of the costs associated with the workload's resource consumption over the past 30 days.
      properties:
        past30Days:
          $ref: "#/components/schemas/Past30DaysCostAnalysis"
        next30Days:
          $ref: "#/components/schemas/Next30DaysCostAnalysis"
      required: [past30Days, next30Days]

    Indicator:
      type: object
      description: An object representing key performance indicators that provide insights into the performance and health of the workload or container.
      properties:
        name:
          type: string
          description: The name of the indicator representing a specific aspect of performance or health.
          enum:
            - OOM
            - CpuThrottling
            - CpuRequestNotSet
            - MemRequestNotSet
            - MemLimitNotSet
            - UnderProvisionedMemRequest
            - UnderProvisionedMemLimit
            - UnderProvisionedCpuRequest
            - UnderProvisionedCpuLimit
            - OverProvisionedCpuRequest
            - OverProvisionedMemRequest
            - RestartsObserved
          example: "OverProvisionedMemRequest"
        type:
          type: string
          description: The type of indicator, categorizing it as either a risk, waste, or no issue (none).
          enum:
            - none
            - risk
            - waste
          example: "waste"
        severityLevel:
          type: integer
          description: The severity level of the indicator, ranging from 0 (no issue) to 3 (critical issue).
          enum:
            - 0
            - 1
            - 2
            - 3
          example: 1
      required: [name, type, severityLevel]

    Container:
      type: object
      description: Detailed information about a specific container within the workload, including its performance indicators and usage statistics.
      properties:
        name:
          type: string
          description: The name of the container.
          example: "container-example-name"
        runningMinutes:
          type: integer
          description: The total number of minutes the container has been running.
          example: 40265
        indicators:
          type: array
          description: A list of indicators providing insights into the performance and health of the container.
          items:
            $ref: "#/components/schemas/Indicator"
        resources:
          type: object
          description: The resource allocation details for the workload, including the current and recommended by PerfectScale allocation.
          properties:
            current:
              $ref: "#/components/schemas/Resources"
            recommended:
              $ref: "#/components/schemas/Resources"
          required: [current, recommended]
        usage:
          type: object
          description: An object representing the resource usage statistics of a container, broken down into CPU and memory consumption.
          properties:
            cpuCores:
              $ref: "#/components/schemas/Percentiles"
            memoryMiB:
              $ref: "#/components/schemas/Percentiles"
          required: [cpuCores, memoryMiB]
      required: [name, runningMinutes, indicators, resources, usage]

    Percentiles:
      type: object
      description: An object representing percentile statistics of resource usage, providing insights into the distribution of usage values over a certain period.
      properties:
        p90:
          type: number
          format: double
          description: The 90th percentile value of resource usage, indicating that 90% of the usage values are below this value and 10% are above.
          example: 0.0015262789745040441
        p95:
          type: number
          format: double
          description: The 95th percentile value of resource usage, indicating that 95% of the usage values are below this value and 5% are above.
          example: 0.0015262789745040441
        p100:
          type: number
          format: double
          description: The 100th percentile value (or maximum value) of resource usage observed during the specified period.
          example: 0.07069631706099244
      required: [p90, p95, p100]

