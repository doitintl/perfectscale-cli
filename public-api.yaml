        propertyName: type
        mapping:
          standard: "#/components/schemas/InfraFitStandardRecommendations"
          karpenter: "#/components/schemas/InfraFitKarpenterRecommendations"

    InfraFitNodeGroup:
      type: object
      properties:
        id:
          type: string
          description: Node group / node pool name.
        autoscalerType:
          type: string
        architectures:
          type: array
          items:
            type: string
        reservations:
          type: array
          items:
            type: string
        nodes:
          $ref: "#/components/schemas/NodesCount"
        pods:
          $ref: "#/components/schemas/PodsCount"
        runningMinutes:
          type: integer
        cpu:
          $ref: "#/components/schemas/CPUUtilization"
        mem:
          $ref: "#/components/schemas/MemUtilization"
        gpu:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GPUUtilization"
        cost:
          $ref: "#/components/schemas/NodeGroupCost"
        labels:
          type: object
          additionalProperties:
            type: string
        seen:
          $ref: "#/components/schemas/SeenWindow"
        nodeTypes:
          type: array
          items:
            $ref: "#/components/schemas/InfraFitNodeType"
        recommendations:
          $ref: "#/components/schemas/InfraFitNodeGroupRecommendations"
      required:
        - id
        - autoscalerType
        - nodes
        - pods
        - cpu
        - mem
        - cost
        - nodeTypes
        - recommendations

    ClusterDetail:
      type: object
      properties:
        uid:
          nullable: true
          type: string
        name:
          type: string
        cloud:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ClusterCloud"
        region:
          nullable: true
          type: string
        createdAt:
          type: string
          format: date-time
        lastTransmittedAt:
          type: string
          format: date-time
        emission:
          type: object
          additionalProperties:
            type: number
            format: double
      required:
        - uid
        - name
        - createdAt
        - lastTransmittedAt
        - emission

    UnevictableWorkloadRef:
      type: object
      description: Identity of the pod's top-level owning workload.
      properties:
        id:
          type: string
          description: Canonical workload id (namespace-kind-name) of the top-level controller.
        name:
          type: string
          description: Denormalized workload name for display.
        type:
          type: string
          description: Kubernetes workload kind (e.g. Deployment, StatefulSet, DaemonSet).
          example: "Deployment"
      required: [id, type]

    UnevictableReasonCode:
      type: string
      description: Stable canonical identifier for an unevictable reason. Decoupled from the mutable display string.
      enum:
        - opt_out_annotation
        - pod_disruption_budget
        - strict_affinity
        - strict_anti_affinity
        - topology_locked
        - taints_not_tolerated
        - local_node_storage
        - static_mirror_pod

    UnevictableMutedByRule:
      type: object
      description: Summary of the dismissal rule that suppressed this finding.
      properties:
        note:
          type: string
          nullable: true
        createdBy:
          type: string
          description: Email of the user who created the rule.
        createTime:
          type: string
          format: date-time
          description: When the rule was created (RFC 3339 UTC).
      required: [createdBy, createTime]

    UnevictableRemediation:
      type: object
      description: >
        Reason-specific fix. currentSpec/recommendedSpec/yamlDiff are null for
        partial/informational cases.
      properties:
        fixSummary:
          type: string
          description: One-line plain-language fix.
        risk:
          type: string
          enum: [none, low, medium, high]
        confidence:
          type: string
          enum: [low, medium, high]
        currentSpec:
          type: string
          nullable: true
          description: Rendered YAML of the current spec; null for partial/informational cases.
        recommendedSpec:
          type: string
          nullable: true
          description: Rendered YAML of the recommended spec; null for partial/informational cases.
        yamlDiff:
          type: string
          nullable: true
          description: Unified diff string; null when there is no clean diff.
      required: [fixSummary, risk, confidence]

    UnevictableReason:
      type: object
      properties:
        reason:
          type: string
          description: Short reason code (e.g. "Topology-Locked", "PDB Violation").
        reasonCode:
          allOf:
            - $ref: "#/components/schemas/UnevictableReasonCode"
          nullable: true
          description: Stable slug derived from the display reason. Null for unrecognised reasons.
        details:
          type: string
          description: Human-readable explanation.
        remediation:
          $ref: "#/components/schemas/UnevictableRemediation"
        mute:
          type: boolean
          description: True when this reason is covered by a dismissal rule and therefore muted.
        mutedByRule:
          allOf:
            - $ref: "#/components/schemas/UnevictableMutedByRule"
          nullable: true
      required: [reason, details]

    UnevictablePodToleration:
      type: object
      properties:
        key:
          type: string
        operator:
          type: string
        value:
          type: string
        effect:
          type: string
      required: [key, operator, effect]

    UnevictablePodAffinity:
      type: object
      description: Simplified affinity block — only the sub-fields used by detection are modelled.
      properties:
        nodeAffinity:
          type: object
          additionalProperties: true
        podAffinity:
          type: object
          additionalProperties: true
        podAntiAffinity:
          type: object
          additionalProperties: true

    UnevictablePodTopologySpreadConstraint:
      type: object
      properties:
        maxSkew:
          type: integer
          format: int32
        topologyKey:
          type: string
        whenUnsatisfiable:
          type: string
        labelSelector:
          type: object
          additionalProperties: true
      required: [maxSkew, topologyKey, whenUnsatisfiable]

    UnevictablePodContainer:
      type: object
      properties:
        name:
          type: string
        image:
          type: string
        cpuRequestCores:
          type: number
          format: double
          nullable: true
          description: CPU requested for the container, in cores; null if unset.
        cpuLimitCores:
          type: number
          format: double
          nullable: true
          description: CPU limit for the container, in cores; null if unset.
        memoryRequestMiB:
          type: number
          format: double
          nullable: true
          description: Memory requested for the container, in MiB; null if unset.
        memoryLimitMiB:
          type: number
          format: double
          nullable: true
          description: Memory limit for the container, in MiB; null if unset.
        gpuRequest:
          type: integer
          nullable: true
          description: GPU units requested for the container; null if unset.
        gpuLimit:
          type: integer
          nullable: true
          description: GPU units the container is limited to; null if unset.
      required: [name, image]

    UnevictablePodOwnerReference:
      type: object
      description: >
        A subset of the pod's Kubernetes OwnerReference fields, used for
        ownership detection; not a complete copy of metadata.ownerReferences.
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        name:
          type: string
        controller:
          type: boolean
          nullable: true
          description: True when this reference is the pod's managing controller.
      required: [apiVersion, kind, name]

    UnevictablePodVolume:
      type: object
      properties:
        name:
          type: string
        hostPath:
          type: string
        emptyDir:
          type: string
        pvcClaimName:
          type: string
      required: [name]

    UnevictablePodSpec:
      type: object
      description: Raw Kubernetes PodSpec fields used by detection, verbatim from the pod.
      properties:
        node:
          type: string
          nullable: true
          description: Node the pod is scheduled on (spec.nodeName); null for Pending pods.
        nodeGroup:
          type: string
          description: Node group the pod's node belongs to; empty if the node's node group is unresolved.
        priority:
          type: integer
          description: Kubernetes pod scheduling priority, from the pod's PriorityClass.
        nodeSelector:
          type: object
          additionalProperties:
            type: string
        affinity:
          $ref: "#/components/schemas/UnevictablePodAffinity"
        tolerations:
          type: array
          items:
            $ref: "#/components/schemas/UnevictablePodToleration"
        containers:
          type: array
          items:
            $ref: "#/components/schemas/UnevictablePodContainer"
        volumes:
          type: array
          items:
            $ref: "#/components/schemas/UnevictablePodVolume"
        topologySpreadConstraints:
          type: array
          items:
            $ref: "#/components/schemas/UnevictablePodTopologySpreadConstraint"
        ownerReferences:
          type: array
          description: >
            The pod's metadata.ownerReferences. Omitted when the pod has no
            owner (e.g. static/mirror pods).
          items:
            $ref: "#/components/schemas/UnevictablePodOwnerReference"

    UnevictablePod:
      type: object
      description: >
        A single unevictable pod from the latest pre-computed snapshot for
        the cluster. Returned both as a list item and as the single-pod
        detail response — the detail response additionally populates
        siblingPodNames.
      properties:
        name:
          type: string
        namespace:
          type: string
        id:
          type: string
        workload:
          $ref: "#/components/schemas/UnevictableWorkloadRef"
        reasons:
          type: array
          description: Empty = pod is evictable; non-empty = unevictable.
          items:
            $ref: "#/components/schemas/UnevictableReason"
        phase:
          type: string
        startTime:
          type: string
          format: date-time
          description: Pod creation timestamp (RFC 3339 UTC).
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        spec:
          $ref: "#/components/schemas/UnevictablePodSpec"
        blockedNodeCount:
          type: integer
          description: Number of nodes this pod blocks from scaling down.
        blockedNodes:
          type: array
          description: Names of the nodes this pod pins.
          items:
            type: string
        blockedCostHourly:
          description: >
            Hourly cost of the blocked nodes (Total Blocked Cost). Filtering
            and sorting compare numerically on the underlying cost value, not
            the serialized Money object.
          allOf:
            - $ref: "#/components/schemas/Money"
        clusterUid:
          type: string
        mute:
          type: boolean
          description: True when the pod's workload is muted by a dismissal rule, muting all of its reasons.
        siblingPodNames:
          type: array
          description: Names of other pods of the same workload id in this snapshot. Populated only by the single-pod detail endpoint.
          items:
            type: string
      required: [name, namespace, id, workload, reasons, phase, startTime]

    UnevictableReportRow:
      type: object
      description: One row of the per-pod issues view — a single unevictable pod with all its reasons combined.
      properties:
        name:
          type: string
        id:
          type: string
        workload:
          $ref: "#/components/schemas/UnevictableWorkloadRef"
        namespace:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        node:
          type: string
          nullable: true
          description: Node the pod is scheduled on; null for Pending pods.
        nodeGroup:
          type: string
          description: Node group the pod's node belongs to; empty if the node's node group is unresolved.
        reasons:
          type: array
          description: All unevictable reasons for this pod.
          items:
            $ref: "#/components/schemas/UnevictableReason"
        mute:
          type: boolean
          description: True when the pod's workload is muted by a dismissal rule, muting all of its reasons.
        priority:
          type: integer
          description: Kubernetes pod scheduling priority; same value as UnevictablePod.spec.priority.
        blockedCostHourly:
          description: >
            Hourly cost of the blocked nodes. Filtering and sorting compare
            numerically on the underlying cost value, not the serialized
            Money object.
          allOf:
            - $ref: "#/components/schemas/Money"
      required: [name, id, workload, namespace, reasons, mute]

    UnevictableSummary:
      type: object
      description: Aggregate pod/node counts for the snapshot backing the listing response.
      properties:
        totalPods:
          type: integer
          description: Total number of pods observed in the snapshot.
        unevictablePods:
          type: integer
          description: Number of pods detected as unevictable in the snapshot.
        mute:
          type: integer
          description: Number of unevictable findings muted by a dismissal rule in this snapshot.
        totalNodes:
          type: integer
          description: Total number of nodes observed in the snapshot.
        autoscalerType:
          type: string
          description: Detected autoscaler, rolled up from per-node detection. Omitted if not detected.
      required: [totalPods, unevictablePods, mute, totalNodes]

    UnevictableMutedWorkload:
      type: object
      properties:
        clusterUid:
          type: string
        id:
          type: string
          description: Canonical workload id (namespace-kind-name) of the top-level controller.
        namespace:
          type: string
        workloadName:
          type: string
          description: Denormalized workload name for display.
        note:
          type: string
        createdBy:
          type: string
          description: Email of the user who created the rule.
        createTime:
          type: string
          format: date-time
          description: When the rule was created (RFC 3339 UTC).
        updateTime:
          type: string
          format: date-time
          description: When the rule was last updated (RFC 3339 UTC).
      required: [clusterUid, id, createdBy, createTime, updateTime]

    UnevictablePodsStatus:
      type: object
      description: >
        Snapshot processing status, returned on 202 (still processing) and
        422 (processing failed) instead of pod/report data.
      properties:
        status:
          type: string
          enum: [processing, failed]
      required: [status]
