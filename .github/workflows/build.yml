name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          set -euo pipefail

          existing_for_commit="$(
            git tag --points-at "$GITHUB_SHA" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          latest="$(
            git tag -l 'v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          if [ -n "$existing_for_commit" ]; then
            version="$existing_for_commit"
            # The previous release is the newest tag that is not this one.
            previous_tag="$(
              git tag -l 'v*' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | grep -vxF "$version" \
                | tail -n 1 \
                || true
            )"
          else
            previous_tag="$latest"
            if [ -z "$latest" ]; then
              version="v1.0.0"
            else
              base="${latest#v}"
              major="${base%%.*}"
              remainder="${base#*.}"
              minor="${remainder%%.*}"
              patch="${base##*.}"
              version="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi

          # Build release notes from the commit messages since the previous tag.
          if [ -n "$PREVIOUS_TAG" ]; then
            range="${PREVIOUS_TAG}..${GITHUB_SHA}"
          else
            range="$GITHUB_SHA"
          fi

          commits="$(git log --no-merges --pretty=format:'- %s (%h)' "$range" || true)"
          if [ -z "$commits" ]; then
            commits="- Automated release for commit ${GITHUB_SHA}"
          fi

          {
            echo "## Changes"
            echo
            echo "$commits"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo
              echo "**Full changelog:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${VERSION}"
            fi
          } > release-notes.md

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md

  goreleaser:
    name: Release via goreleaser
    runs-on: ubuntu-latest
    needs:
      - test
      - prepare-release
    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.prepare-release.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    env:
      # step-level `if:` can't reference `secrets` directly, so mirror them
      # into env first.
      HOMEBREW_TAP_APP_CLIENT_ID: ${{ secrets.HOMEBREW_TAP_APP_CLIENT_ID }}
      HOMEBREW_TAP_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.version }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Mint homebrew-tap installation token
        id: tap-token
        # Skips cleanly (empty output) until the HOMEBREW_TAP_APP_* secrets
        # exist, so releases keep publishing binaries in the meantime — just
        # without the Homebrew formula update. See goreleaser step below.
        if: ${{ env.HOMEBREW_TAP_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ env.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: doitintl
          repositories: homebrew-tap

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean${{ steps.tap-token.outputs.token == '' && ' --skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}

  skill:
    name: Package skill
    runs-on: ubuntu-latest
    needs:
      - test
      - prepare-release
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build skill zip
        run: make skill

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perfectscale-skill
          path: dist/perfectscale-skill.zip
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$VERSION" dist/perfectscale-skill.zip --clobber
